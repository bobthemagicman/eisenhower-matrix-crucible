# Amplify Hosting: publishes the page as a static site. No build step and no dependencies.
#
# config.js is git-ignored, so it is written here from the Amplify environment variable
# CRUCIBLE_CONFIG: the infra stack's CrucibleConfig output (a JSON object: source + auth). It holds
# identifiers only (bucket, pool and client IDs), no secrets. Nobody's items are ever deployed: they
# live in S3 or DynamoDB and each signed-in user can read only their own.
version: 1
frontend:
  phases:
    build:
      commands:
        - rm -rf site && mkdir -p site
        - cp index.html sample-items.js site/
        - cp -R lib schema site/
        - >-
          node -e 'const raw=process.env.CRUCIBLE_CONFIG;
          if(!raw){console.error("Set the CRUCIBLE_CONFIG environment variable to the stack CrucibleConfig output.");process.exit(1)}
          const c=JSON.parse(raw);
          if(!c.source||!c.auth){console.error("CRUCIBLE_CONFIG needs source and auth.");process.exit(1)}
          require("fs").writeFileSync("site/config.js","window.CRUCIBLE_CONFIG = "+JSON.stringify(c)+";\n")'
  artifacts:
    baseDirectory: site
    files:
      - '**/*'
