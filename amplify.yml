# Amplify Hosting: publishes the page as a static site. No build step and no dependencies.
#
# config.js is git-ignored, so it is written here from the Amplify environment variable
# CRUCIBLE_CONFIG: the infra stack's CrucibleConfig output (a JSON object: source + auth). It holds
# identifiers only (bucket, pool and client IDs), no secrets. Nobody's items are ever deployed: they
# live in S3 or DynamoDB and each signed-in user can read only their own.
version: 1
frontend:
  phases:
    build:
      commands:
        - bash scripts/build-site.sh
  artifacts:
    baseDirectory: site
    files:
      - '**/*'
