name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Infra typechecks and synthesizes
        working-directory: infra
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npx cdk synth -c domainPrefix=ci-synth-check --quiet
