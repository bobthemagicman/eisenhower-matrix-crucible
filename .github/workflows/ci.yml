name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Infra typechecks and synthesizes
        working-directory: infra
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          CDK_DEFAULT_ACCOUNT=123456789012 CDK_DEFAULT_REGION=us-west-2 npx cdk synth -c allowedEmailDomain=example.com --quiet
